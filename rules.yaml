# 仕分けルール。後半は答えが一つに決まらない／ルール同士がぶつかる問題で、モデル間の差が出やすい
- id: r01
  text: ピンクを含む物は左へ。それ以外は右へ。
- id: r02
  text: 丸い物は必ず中央へ。それ以外は左へ。
- id: r03
  text: 黄色の物は右へ。青い物は左へ。それ以外は中央へ。
- id: r04
  text: 暖色（赤・オレンジ・黄・ピンク）の物は左へ、寒色（青・緑）の物は右へ。
- id: r05
  text: 机の下半分にある物は中央へ、上半分にある物は右へ。
- id: r06
  text: 2色以上が混ざった物は中央へ。単色の赤は左、それ以外の単色は右へ。
- id: r07
  text: ピンクを含む物は左へ。丸い物は中央へ。
- id: r08
  text: 食べ物に見える物は右へ。それ以外は左へ。
- id: r09
  text: 信号機の色に従って、止まれの色は左、注意の色は中央、進めの色は右へ。
- id: r10
  text: 一番大きい物だけ右へ。他は左へ。
- id: r11
  text: 緑以外の物は、丸ければ左、角ばっていれば右へ。緑の物は中央へ。
- id: r12
  text: 机の左端に近い物ほど左の置き場へ。
